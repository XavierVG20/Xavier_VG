  <!-- Script de Escritura Automática y Partículas -->
  <script>
    // --- 1. Efecto de Escritura y Borrado Automático en el Título Principal ---
    const titles = [
      "CONTáctame",
      "ESTABLECEMOS CONEXIÓN",
      "DISPONIBLE PARA PROYECTOS"
    ];
    
    let titleIndex = 0;

    function typeTitle() {
      let currentWord = titles[titleIndex].split("");
      let loopTyping = function() {
        if (currentWord.length > 0) {
          document.getElementById('typed-title').innerHTML += currentWord.shift();
        } else {
          setTimeout(deleteTitle, 2200);
          return;
        }
        setTimeout(loopTyping, 90);
      };
      loopTyping();
    }

    function deleteTitle() {
      let currentWord = titles[titleIndex].split("");
      let loopDeleting = function() {
        if (currentWord.length > 0) {
          currentWord.pop();
          document.getElementById('typed-title').innerHTML = currentWord.join("");
        } else {
          titleIndex = (titleIndex + 1) % titles.length;
          setTimeout(typeTitle, 500);
          return;
        }
        setTimeout(loopDeleting, 50);
      };
      loopDeleting();
    }

    typeTitle();


    // --- 2. Animación de Partículas Pequeñas y Sutiles al Frente ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const codeChars = ['{ }', '</>', '$', '0', '1', 'PHP', 'JS', 'SQL', '[]', '=>', ';', 'fn', 'Docker', 'ML', 'Python'];
    let particles = [];
    const particleCount = 35;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        text: codeChars[Math.floor(Math.random() * codeChars.length)],
        speed: 0.5 + Math.random() * 1.5,
        opacity: 0.15 + Math.random() * 0.35,
        fontSize: 10 + Math.random() * 4
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#64ffda';
      particles.forEach(p => {
        ctx.globalAlpha = p.opacity;
        ctx.font = `${p.fontSize}px 'Fira Code', monospace`;
        ctx.fillText(p.text, p.x, p.y);

        p.y -= p.speed;
        if (p.y < -20) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animateParticles);
    }

    animateParticles();
  </script>
