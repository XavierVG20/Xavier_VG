  <!-- Script para animación de partículas y efecto de escritura/borrado -->
  <script>
    // --- 1. Efecto de Escritura y Borrado (Typewriter) ---
    const words = [
      "Tecnólogo Superior en Desarrollo de Software",
      "Responsable de TICS",
      "Backend & Database Developer",

    ];
    
    let i = 0;
    let timer;

    function typingEffect() {
      let word = words[i].split("");
      var loopTyping = function() {
        if (word.length > 0) {
          document.getElementById('typed-text').innerHTML += word.shift();
        } else {
          setTimeout(deletingEffect, 2000); // Pausa antes de empezar a borrar
          return;
        }
        timer = setTimeout(loopTyping, 90); // Velocidad de escritura
      };
      loopTyping();
    }

    function deletingEffect() {
      let word = words[i].split("");
      var loopDeleting = function() {
        if (word.length > 0) {
          word.pop();
          document.getElementById('typed-text').innerHTML = word.join("");
        } else {
          if (words.length > (i + 1)) {
            i++;
          } else {
            i = 0;
          }
          setTimeout(typingEffect, 500); // Pausa antes de escribir la siguiente palabra
          return;
        }
        timer = setTimeout(loopDeleting, 50); // Velocidad de borrado
      };
      loopDeleting();
    }

    typingEffect();


    // --- 2. Animación de Partículas de Código en el Fondo ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const codeChars = ['{ }', '</>', '$', '0', '1', 'PHP', 'JS', 'SQL', '[]', '=>', ';', 'fn'];
    let particles = [];
    const particleCount = 35;

    for (let i = 0; i < particleCount; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        text: codeChars[Math.floor(Math.random() * codeChars.length)],
        speed: 0.5 + Math.random() * 1.5,
        opacity: 0.15 + Math.random() * 0.35,
        fontSize: 12 + Math.random() * 10
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = '#64ffda';
      particles.forEach(p => {
        ctx.globalAlpha = p.opacity;
        ctx.font = `${p.fontSize}px 'Fira Code', monospace`;
        ctx.fillText(p.text, p.x, p.y);

        p.y -= p.speed;
        if (p.y < -20) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }
      });

      requestAnimationFrame(animateParticles);
    }

    animateParticles();
  </script>
